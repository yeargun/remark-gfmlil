# reusable ESM — host-visible names stay
[javascript]
# 8.6 (measured, ten pool ports): the emission's canonical peephole chain,
# re-opened on the terminal artifact, is a per-port win -- this port -100/-63/-32/-18
# Brotli -- while jquerylil +245 and katexlil +151 refuse it.
terminal_cleanup_chain = true
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
# 8.19 (measured, fleet sweep of five reserves): the naming reserve picks the
# basin, not the depth, and the curve is not monotone -- 8:-33, 16:-23, 32:-42, 64:+133
# against the declared 0. Re-measure it after any emitter change.
local_name_reserve = 32
candidate_search = "always"
function_spelling = "arrow"
public_aggregate_abi = "named"
# 8.15 (measured, ten pool ports): Terser's `collapse_vars` accepts a definition
# whose value reads the name it defines, and a name the function assigns more
# than once; the emitter's conservative collapse refuses both. Widening it is a
# win on three ports and a loss on three, so each says so for itself.
wide_single_use_collapse = true
# 8.16 (measured, this artifact): the beam width picks which basin the terminal
# search lands in, and the curve is not monotone -- 8:-56, 12:+0, 16:-69, 20:-142 against the
# default. It is tuned, not raised, and it drifts with the compiler, so it is
# re-measured rather than trusted. (The five largest ports do not respond to it
# at all: their width is clamped by the candidate limit before the beam binds.)
candidate_beam_width = 20
# 8.20 (measured, fleet sweep of four budgets): the candidate byte budget is a
# basin dial, not a depth dial -- 1 MiB (default) +0, 2 MiB -17, 8 MiB +192, 16 MiB +225.
# Re-measure it after any emitter change.
candidate_byte_budget = 2097152
# 8.22 (measured, fleet): re-emitting a twice- or thrice-read member off a
# short pure receiver instead of naming it. Raw goes up and Brotli down --
# upstream repeats `e[p][1].end.offset` verbatim where SSA destruction names
# it, and every name is a string the codec cannot match. -14 Brotli here;
# +170 on micromarklil, +80 on markedlil, so it is declared per port.
rematerialize_member_reads = true
# Required by the rematerialisation above: a duplicated property read must
# not be able to run a getter twice. This port reads plain data.
assume_pure_property_reads = true
# 8.23 (measured, fleet): the terminal idiom-directed naming search is -8
# Brotli here; +95 on micromarklil and nothing on the other seven.
idiom_directed_naming = true

[mangle]
identifiers = true
properties = true
exports = false
extern_fields = true
pool_strings = true
