# reusable ESM — host-visible names stay
[javascript]
# 8.6 (measured, ten pool ports): the emission's canonical peephole chain,
# re-opened on the terminal artifact, is a per-port win -- this port -100/-63/-32/-18
# Brotli -- while jquerylil +245 and katexlil +151 refuse it.
terminal_cleanup_chain = true
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
local_name_reserve = 0
candidate_search = "always"
function_spelling = "arrow"
public_aggregate_abi = "named"
# 8.15 (measured, ten pool ports): Terser's `collapse_vars` accepts a definition
# whose value reads the name it defines, and a name the function assigns more
# than once; the emitter's conservative collapse refuses both. Widening it is a
# win on three ports and a loss on three, so each says so for itself.
wide_single_use_collapse = true

[mangle]
identifiers = true
properties = true
exports = false
extern_fields = true
pool_strings = true
